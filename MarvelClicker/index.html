<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarvelClicker</title>
  <link rel="icon" type="image/jpeg" href="https://cdn.prod.website-files.com/687e8d1b96312cc631cafec7/68c4923f8d3fe2e6049f922b_680a81711c6beaadcdd626f7_66e89fd24a31b9d1928f22fa_6138df4ee5575a78d7898150_6.jpeg">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitcount+Prop+Double:wght@100..900&display=swap');

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: 'Bebas Neue', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
      background-color: #1b1b1b;
      color: white;
    }

    #top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: white;
      text-align: center;
      font-size: 4rem;
      background-color: #cc0000;
      border-radius: 18px;
      color: white;
      box-shadow: 0 8px 14px #520303;
    }

    #main-content {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 2fr 3fr 2fr;
      gap: 20px;
      align-items: stretch;
      margin-top: 20px;
    }

    #sidebar-left,
    #sidebar-center,
    #sidebar-shop {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #leaderboard,
    #snaparea,
    #shop {
      flex: 1;
      border: 2px solid #333333;
      border-top: 0;
      border-radius: 0 0 18px 18px;
      padding: 20px;
    }

    #leaderboard {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
    }

    #shop {
      display: flex;
      min-height: 0;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid #ebebeb;
      font-size: 2.3em;
    }

    #profileinfo {
      display: flex;
      min-height: 82px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .profile-primary {
      font-size: 1em;
    }

    .profile-secondary {
      margin-top: 5px;
      color: #ffcc00;
      font-size: 0.65em;
    }

    .boost-status {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 12px;
      border-radius: 10px;
      background: #cc0000;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    .shop-card {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto auto;
      column-gap: 12px;
      align-content: center;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid #555;
      border-radius: 12px;
      background: #272727;
    }

    .shop-card.owned {
      border-color: #d4af37;
      background: #352f1d;
    }

    .shop-card h3 {
      color: #ffcc00;
      font-size: 1.6rem;
      letter-spacing: 1px;
    }

    .shop-card p {
      margin-top: 5px;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .shop-price {
      color: #ffcc00;
      font-weight: 700;
    }

    .shop-buy-button {
      grid-column: 2;
      grid-row: 1 / 4;
      min-width: 70px;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #cc0000;
      color: white;
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .shop-buy-button:disabled {
      background: #555;
      color: #bbb;
      cursor: not-allowed;
    }

    #snaparea {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #gauntlet-image {
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }

    .snap-bubble {
      position: absolute;
      z-index: 10;
      color: #ffcc00;
      font-family: "Bitcount Prop Double", sans-serif;
      font-size: 3rem;
      font-weight: 700;
      pointer-events: none;
      transform: translate(-50%, -50%);
      text-shadow: 2px 2px 0 #cc0000;
      animation: bubble-float 1.5s ease-out forwards;
    }

    @keyframes bubble-float {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(0.5);
      }

      30% {
        transform: translate(-50%, -50%) translateY(-20px) scale(1.3);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-120px) scale(1);
      }
    }

    .snapping-effect {
      position: absolute;
      z-index: 5;
      width: 80px;
      pointer-events: none;

      animation: snapping-pop 1s ease-out forwards;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 10, 10, 0.9);
    }

    #loading-screen[hidden] {
      display: none;
    }

    .loading-panel {
      width: min(420px, 100%);
      padding: 32px;
      border: 2px solid #cc0000;
      border-radius: 18px;
      background: #242424;
      text-align: center;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 5px solid #666;
      border-top-color: #cc0000;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    #loading-message {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    #retry-button {
      margin-top: 20px;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #cc0000;
      color: white;
      font: inherit;
      font-size: 1.4rem;
      cursor: pointer;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes snapping-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }

      25% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.25);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
      }
    }


    h2 {
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 2.2em;
      background-color: #333333;
      color: rgb(255, 255, 255);
      border-radius: 18px 18px 0 0;
      letter-spacing: 2px;
    }

    @media (max-width: 1000px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      #main-content {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      #sidebar-left,
      #sidebar-center,
      #sidebar-shop {
        width: 100%;
        max-width: 100%;
      }

      #leaderboard {
        height: auto;
        max-height: 45vh;
        overflow-y: auto;
      }

      #shop {
        height: auto;
        overflow: visible;
      }

      .shop-card {
        flex: none;
      }

      #snaparea {
        flex: none;
        height: auto;
      }
    }
  </style>

</head>

<body>
  <div id="loading-screen" role="status">
    <div class="loading-panel">
      <div class="loading-spinner"></div>
      <p id="loading-message">Connecting to database...</p>
      <button id="retry-button" type="button" hidden>Try again</button>
    </div>
  </div>
  <div id="top-bar">MarvelClicker</div>
  <main id="main-content">
    <div id="sidebar-left">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
    <div id="sidebar-center">
      <h2 id="profileinfo"></h2>
      <div id="snaparea"></div>
    </div>
    <aside id="sidebar-shop">
      <h2>Shop</h2>
      <div id="shop"></div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>

</html>
